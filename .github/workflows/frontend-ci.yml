name: HERWET Production CI

on:
  push:
    branches: [herwet-production-v1]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Check API syntax
        working-directory: server
        run: node --check src/server.js
      - name: Test API media policy
        working-directory: server
        run: npm test
