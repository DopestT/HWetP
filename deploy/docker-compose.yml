services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herwet}
      POSTGRES_USER: ${POSTGRES_USER:-herwet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - herwet_db:/var/lib/postgresql/data
      - ../server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-herwet} -d ${POSTGRES_DB:-herwet}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-herwet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-herwet}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://herwet.com,https://www.herwet.com}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  herwet_db:
  caddy_data:
  caddy_config:
